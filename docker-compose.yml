# CEP demo — the CEP-owned services. Nautobot and Zabbix run from their own
# official compose projects (see docs/QUICKSTART.md) and are joined on this
# network so the sidecar can receive Zabbix webhooks. Kept separate because
# hand-rolling Zabbix/Nautobot compose is fragile; upstream projects are canonical.
name: cep-demo
services:
  sidecar:
    build:
      context: .
      dockerfile: docker/Dockerfile.sidecar
    container_name: cep-sidecar
    environment:
      CEP_WINDOW_S: "60"
      TOPOLOGY_FILE: "/app/topology.json"
    ports: ["8090:8090"]
    networks: [cep]

  webui:
    image: nginx:alpine
    container_name: cep-webui
    volumes:
      - ./webui:/usr/share/nginx/html:ro
    ports: ["8088:80"]
    depends_on: [sidecar]
    networks: [cep]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: cep-prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    networks: [cep]

  grafana:
    image: grafana/grafana:11.4.0
    container_name: cep-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    networks: [cep]

networks:
  cep:
    name: cep-demo-net
