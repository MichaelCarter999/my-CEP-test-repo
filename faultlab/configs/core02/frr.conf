frr defaults traditional
hostname core02
no ipv6 forwarding
!
interface lo
 ip address 10.255.0.2/32
 ip ospf area 0
!
interface eth1
 ip address 10.0.0.2/30
 ip ospf network point-to-point
 ip ospf area 0
!
interface eth2
 ip address 10.0.2.1/30
 ip ospf network point-to-point
 ip ospf area 0
!
router ospf
 ospf router-id 10.255.0.2
 redistribute connected
!
line vty
!
