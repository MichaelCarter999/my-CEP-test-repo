frr defaults traditional
hostname acc-a4
no ipv6 forwarding
!
interface lo
 ip address 10.255.0.24/32
 ip ospf area 0
!
interface eth1
 ip address 10.0.4.2/30
 ip ospf network point-to-point
 ip ospf area 0
!
interface eth2
 ip address 10.0.5.1/30
 ip ospf network point-to-point
 ip ospf area 0
!
router ospf
 ospf router-id 10.255.0.24
 redistribute connected
!
line vty
!
