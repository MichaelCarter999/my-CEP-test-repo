# snmptrapd.conf for the CEP demo trap collector (path A).
# Accept SNMPv2c traps with the demo community and hand them to the Zabbix
# formatter built into the zabbix-snmptraps image (writes ZBXTRAP lines to
# /var/lib/zabbix/snmptraps/snmptraps.log, which the Zabbix server reads).
#
# Match the community your devices / the trap sim use:
#   python ../send_trap.py linkDown --device acc-a1 --community cep-demo --target <host>:162
authCommunity execute,net cep-demo
authCommunity execute,net public
disableAuthorization no
# The image's default Zabbix trap-format handler is invoked automatically;
# do not add a conflicting traphandle/format here unless you override the image.
