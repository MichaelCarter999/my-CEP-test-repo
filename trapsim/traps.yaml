# traps.yaml — trap definitions as data, so the simulator and receiver stay in
# sync and adding the real Actelis traps later is a pure-data change.
#
# Token substitution in `oid` and `value`: {ifindex}, {device}, {index}.
# Types: Integer | OctetString | OID | TimeTicks | IpAddress | Counter32 | Gauge32
#
# cep_kind = the event kind POSTed to the sidecar /events when this trap arrives.
# NOTE: a fully-dead device sends NO trap (it can't) — device death is detected by
# polling (see faultlab/monitor.py). Traps carry events a LIVE device reports:
# link transitions, restarts, and vendor alarms. So most map to LINK_* / VENDOR_*.

# ---- standard traps (MIB-II / IF-MIB / SNMPv2-MIB) — fully specified ---------
standard:
  coldStart:
    oid: "1.3.6.1.6.3.1.1.5.1"
    cep_kind: RESTART
    varbinds: []
  warmStart:
    oid: "1.3.6.1.6.3.1.1.5.2"
    cep_kind: RESTART
    varbinds: []
  linkDown:
    oid: "1.3.6.1.6.3.1.1.5.3"
    cep_kind: LINK_DOWN
    varbinds:
      - { oid: "1.3.6.1.2.1.2.2.1.1.{ifindex}", type: Integer, value: "{ifindex}" }   # ifIndex
      - { oid: "1.3.6.1.2.1.2.2.1.7.{ifindex}", type: Integer, value: "1" }            # ifAdminStatus up(1)
      - { oid: "1.3.6.1.2.1.2.2.1.8.{ifindex}", type: Integer, value: "2" }            # ifOperStatus down(2)
  linkUp:
    oid: "1.3.6.1.6.3.1.1.5.4"
    cep_kind: LINK_UP
    varbinds:
      - { oid: "1.3.6.1.2.1.2.2.1.1.{ifindex}", type: Integer, value: "{ifindex}" }
      - { oid: "1.3.6.1.2.1.2.2.1.7.{ifindex}", type: Integer, value: "1" }            # ifAdminStatus up(1)
      - { oid: "1.3.6.1.2.1.2.2.1.8.{ifindex}", type: Integer, value: "1" }            # ifOperStatus up(1)
  authenticationFailure:
    oid: "1.3.6.1.6.3.1.1.5.5"
    cep_kind: SECURITY
    varbinds: []

# ---- vendor / enterprise section — PLACEHOLDER pending the Actelis MIB --------
# Replace `enterprise_oid` with Actelis's IANA PEN root and fill `traps` from the
# NOTIFICATION-TYPE / TRAP-TYPE definitions in the Actelis MIB(s). The varbind OIDs
# and value enums below are illustrative placeholders, NOT real Actelis OIDs.
enterprise:
  vendor: "Actelis (PLACEHOLDER — supply MIB)"
  enterprise_oid: "1.3.6.1.4.1.99999"          # TODO: Actelis PEN from IANA / MIB
  send_trap_enterprise_varbind: true            # adds snmpTrapEnterprise.0
  traps:
    vendorAlarmRaise:
      # SNMPv1-style enterprise trap OID convention: <enterprise>.0.<specific>
      oid: "1.3.6.1.4.1.99999.0.1"              # TODO: real trap OID from MIB
      cep_kind: VENDOR_ALARM
      varbinds:
        - { oid: "1.3.6.1.4.1.99999.1.1.0", type: OctetString, value: "{device}" }   # TODO alarmSource
        - { oid: "1.3.6.1.4.1.99999.1.2.0", type: Integer,     value: "3" }          # TODO alarmSeverity (placeholder)
        - { oid: "1.3.6.1.4.1.99999.1.3.0", type: OctetString, value: "placeholder alarm text" }  # TODO alarmText
    vendorAlarmClear:
      oid: "1.3.6.1.4.1.99999.0.2"              # TODO
      cep_kind: VENDOR_CLEAR
      varbinds:
        - { oid: "1.3.6.1.4.1.99999.1.1.0", type: OctetString, value: "{device}" }
